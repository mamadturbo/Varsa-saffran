# Include in the HTTPS server configured for the actual storefront domain.
# TLS certificates and server_name are intentionally host-specific.
root /opt/varsa/current/artifacts/varsa-shop/dist/public;
index index.html;
client_max_body_size 6m;
include /etc/nginx/snippets/varsa-security-headers.conf;
client_body_timeout 15s;
client_header_timeout 10s;
send_timeout 30s;

location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header X-Powered-By;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location /assets/ {
    try_files $uri =404;
    gzip on;
    gzip_types application/javascript text/css;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/varsa-security-headers.conf;
}
location /fonts/ {
    try_files $uri =404;
    expires 30d;
}
location ~ /\. { deny all; }
location ~ \.map$ { return 404; }
location = /api { return 404; }
location = /robots.txt { try_files "" @varsa_storefront; }
location = /index.html { try_files "" @varsa_storefront; }
location / {
    try_files $uri @varsa_storefront;
}
location @varsa_storefront {
    proxy_pass http://127.0.0.1:5174;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_cache off;
    gzip on;
    gzip_types application/xml;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}
